<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FACET — Facial Analysis</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0b0b0d;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 40px 20px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #999;
            margin-bottom: 40px;
        }

        .upload-box {
            border: 1px dashed #555;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
        }

        input[type="file"] {
            margin-top: 20px;
        }

        .analysis {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background: #151519;
            border: 1px solid #29292f;
            border-radius: 16px;
            padding: 25px;
        }

        .metric-name {
            color: #999;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .metric-value {
            font-size: 32px;
            font-weight: bold;
        }

        .image-container {
            position: relative;
            width: 100%;
        }

        #inputImage {
            width: 100%;
            max-height: 600px;
            object-fit: contain;
            display: none;
            border-radius: 12px;
        }

        #landmarkCanvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        #status {
            margin-top: 20px;
            color: #aaa;
        }

        @media (max-width: 700px) {
            .analysis {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>FACET</h1>

    <div class="subtitle">
        Facial geometry analysis powered by computer vision.
    </div>

    <div class="upload-box">

        <h2>Upload a frontal photograph</h2>

        <p>
            Use a clear, front-facing photograph with your entire face visible.
        </p>

        <input
            type="file"
            id="imageUpload"
            accept="image/*"
        >

        <div id="status">
            Loading facial analysis model...
        </div>

    </div>


    <div class="image-container">

        <img id="inputImage">

        <canvas id="landmarkCanvas"></canvas>

    </div>


    <br>


    <div class="analysis">

        <div class="card">

            <div class="metric-name">
                FACIAL WIDTH / HEIGHT
            </div>

            <div
                class="metric-value"
                id="widthHeight"
            >
                —
            </div>

        </div>


        <div class="card">

            <div class="metric-name">
                FACE DETECTION
            </div>

            <div
                class="metric-value"
                id="detectionStatus"
            >
                —
            </div>

        </div>

    </div>

</div>


<!-- MediaPipe -->

<script type="module">

    import {
        FaceLandmarker,
        FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22";


    // --------------------------------------------------
    // 1. LOAD MEDIAPIPE
    // --------------------------------------------------

    const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
    );


    const faceLandmarker =
        await FaceLandmarker.createFromOptions(
            vision,
            {
                baseOptions: {

                    modelAssetPath:
                        "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",

                    delegate: "GPU"

                },

                runningMode: "IMAGE",

                numFaces: 1,

                minFaceDetectionConfidence: 0.5,

                minFacePresenceConfidence: 0.5,

                minTrackingConfidence: 0.5,

                outputFaceBlendshapes: false,

                outputFacialTransformationMatrixes: true

            }
        );


    document.getElementById("status").textContent =
        "Ready — upload a frontal photograph.";


    // --------------------------------------------------
    // 2. HELPER FUNCTIONS
    // --------------------------------------------------


    function distance(pointA, pointB) {

        const dx = pointA.x - pointB.x;

        const dy = pointA.y - pointB.y;

        const dz = pointA.z - pointB.z;

        return Math.sqrt(
            dx * dx +
            dy * dy +
            dz * dz
        );
    }


    // --------------------------------------------------
    // 3. IMAGE UPLOAD
    // --------------------------------------------------

    const upload =
        document.getElementById("imageUpload");


    upload.addEventListener(
        "change",
        async function(event) {

            const file =
                event.target.files[0];


            if (!file) return;


            const image =
                document.getElementById("inputImage");


            image.src =
                URL.createObjectURL(file);


            image.onload =
                async function() {

                    image.style.display =
                        "block";


                    const canvas =
                        document.getElementById(
                            "landmarkCanvas"
                        );


                    canvas.width =
                        image.clientWidth;


                    canvas.height =
                        image.clientHeight;


                    // ----------------------------------
                    // RUN MEDIAPIPE
                    // ----------------------------------

                    const result =
                        faceLandmarker.detect(image);


                    if (
                        !result.faceLandmarks ||
                        result.faceLandmarks.length === 0
                    ) {

                        document.getElementById(
                            "detectionStatus"
                        ).textContent =
                            "No face detected";

                        return;

                    }


                    document.getElementById(
                        "detectionStatus"
                    ).textContent =
                        "Detected";


                    const landmarks =
                        result.faceLandmarks[0];


                    // ----------------------------------
                    // FACIAL WIDTH
                    // ----------------------------------

                    const leftFace =
                        landmarks[234];


                    const rightFace =
                        landmarks[454];


                    const facialWidth =
                        distance(
                            leftFace,
                            rightFace
                        );


                    // ----------------------------------
                    // FACIAL HEIGHT
                    // ----------------------------------

                    const topFace =
                        landmarks[10];


                    const bottomFace =
                        landmarks[152];


                    const facialHeight =
                        distance(
                            topFace,
                            bottomFace
                        );


                    // ----------------------------------
                    // WIDTH / HEIGHT
                    // ----------------------------------

                    const ratio =
                        facialWidth /
                        facialHeight;


                    document.getElementById(
                        "widthHeight"
                    ).textContent =
                        ratio.toFixed(3);


                    // ----------------------------------
                    // DRAW LANDMARKS
                    // ----------------------------------

                    const ctx =
                        canvas.getContext("2d");


                    ctx.clearRect(
                        0,
                        0,
                        canvas.width,
                        canvas.height
                    );


                    ctx.fillStyle =
                        "white";


                    for (
                        const landmark
                        of landmarks
                    ) {

                        const x =
                            landmark.x *
                            canvas.width;


                        const y =
                            landmark.y *
                            canvas.height;


                        ctx.beginPath();

                        ctx.arc(
                            x,
                            y,
                            1.5,
                            0,
                            Math.PI * 2
                        );

                        ctx.fill();

                    }

                };

        }
    );

</script>

</body>
</html>
